[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transpilador-java-php"
version = "0.1.0"
description = "Transpilador de um subconjunto de Java para PHP"
requires-python = ">=3.10"
dependencies = ["ply>=3.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transpilar = "transpilador.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
